# The bundle id predates the rename to Tenzen Studio and stays: macOS ties the
# URL scheme registration and the user's Open Anyway approval history to it.
appId: com.tenzen.apparel-designer
productName: Tenzen Studio
directories:
  output: dist
  buildResources: assets
files:
  - index.html
  - style.css
  - src/**/*
  - electron/main.js
  - electron/preload.js
  - electron/bgremove.js
  - electron/bgworker.js
  - electron/update.js
  - electron/fonts.js
  - electron/zip.js
  - electron/video.js
  - "!**/*.map"
# Background removal runs in a spawned system Node, which cannot read anything
# inside an asar archive. Its script and the native runtime have to sit on the
# real filesystem.
asarUnpack:
  - electron/bgworker.js
  # The whole onnxruntime family, not just the node package: it requires
  # onnxruntime-common at load, and a dependency left inside the archive is
  # invisible to a plain Node no matter where the parent sits.
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
# No version in the filename, so the release page always carries the same
# download link: /releases/latest/download/Tenzen-Studio-mac-arm64.dmg
artifactName: Tenzen-Studio-mac-${arch}.dmg

# tenzen-studio://open launches the app, or brings it forward if it is already
# open; nothing else. apparel-designer:// is the old name, kept because Tenzen
# HQ's Tools page links to it.
protocols:
  - name: Tenzen Studio
    schemes:
      - tenzen-studio
      - apparel-designer

mac:
  category: public.app-category.graphics-design
  icon: assets/icon.icns
  minimumSystemVersion: "11.0"
  target:
    - target: dmg
      arch: [arm64]
  # Unsigned. Notarising needs a paid Apple developer account, so the first
  # launch goes through Privacy & Security once. The README walks through it,
  # and it is also why the app updates its own source rather than trying to
  # replace its bundle, which macOS will not do without a signature.
  identity: null
dmg:
  title: Tenzen Studio
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications
